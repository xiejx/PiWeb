# PiWeb Nginx site — installed by installer.sh with @PIWEB_DIR@ substituted.
# The app listens on 127.0.0.1:8000; Nginx terminates the client connection.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Needed for backup restore uploads (8 MB bundle, JSON/base64).
    client_max_body_size 12m;

    # Static assets are served straight from disk (fast, no Python involved).
    location /static/ {
        alias @PIWEB_DIR@/app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Never expose private data even if the document root changes later.
    location ~ ^/(data|buttons|command_logs|user_scripts|app|deploy)/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}

# HTTPS: run `certbot --nginx` (or add your own certificate) and keep
# session.cookie_secure = true in config.toml.
