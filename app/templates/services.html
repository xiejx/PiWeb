{% extends "base.html" %}
{% block title %}{{ t('nav.services', 'Services') }}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
        <h1 class="h3 mb-1">{{ t('svc.title', 'Services') }}</h1>
        <div class="muted-small">{{ t('svc.subtitle', 'Start or stop system services. Only service names are accepted.') }}</div>
    </div>
    <button class="btn btn-outline-secondary btn-sm"
            hx-get="/partials/services" hx-target="#servicesArea" hx-swap="innerHTML">
        <i class="bi bi-arrow-clockwise me-1"></i>{{ t('common.refresh', 'Refresh') }}
    </button>
</div>

<div id="servicesArea" hx-get="/partials/services" hx-trigger="every 15s" hx-swap="innerHTML">
    {% include "partials/services_table.html" %}
</div>
{% endblock %}
