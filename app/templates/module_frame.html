{% extends "base.html" %}
{% block title %}{{ module.title }}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
    <h1 class="h4 mb-0">{{ module.title }}</h1>
    <a class="btn btn-sm btn-outline-secondary" href="{{ module.url }}" target="_blank" rel="noopener">
        <i class="bi bi-box-arrow-up-right me-1"></i>{{ t('mod.open_new', 'Open in a new tab') }}
    </a>
</div>

<div class="card">
    <div class="card-body p-0">
        <iframe src="{{ module.url }}" title="{{ module.title }}"
                class="w-100 d-block border-0" style="height: calc(100vh - 240px); min-height: 420px;"
                sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-downloads"
                referrerpolicy="same-origin"></iframe>
    </div>
</div>

<p class="muted-small mt-2 mb-0">
    {{ t('mod.frame_note', 'Third-party module loaded in a sandboxed frame.') }}
    <code>{{ module.url }}</code>
</p>
{% endblock %}
