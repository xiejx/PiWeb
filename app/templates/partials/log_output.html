<div class="d-flex justify-content-between align-items-center mb-2">
    <span class="muted-small mono">{{ source }}</span>
    <button class="btn btn-sm btn-outline-secondary" type="button"
            onclick="document.querySelector('#logOutput .terminal')?.scrollTo({top: 0})">

    </button>

<pre class="terminal log-viewer mb-0">{{ output }}</pre>
